<!DOCTYPE html>
<html lang="en">
  <head>
    <meta Charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Web - Cari profil github</title>
    <style>
      /* CSS */
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background-color: white;
        padding:20px 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0, 1);
        width: 320px;
        text-align: center;
      }
      
      h2{
        font-size: 1.2rem;
        color: #333;
        margin-bottom: 15px;


      }

      .search-area {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;

      }

      input {
        flex: 1;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 8px 15px;
        background-color: #2ea44f;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;

      }

       button:hover {
        background-color: #22863A;
       } 

       /* class untuk menyembunyikan  elemen  */
       .hidden {
        display: none !important;

       }

       /* styling notifikasi */
    </style>
  </head>
