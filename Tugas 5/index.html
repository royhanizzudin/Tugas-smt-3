<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pencarian Profil GitHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Cari Profil GitHub</h1>

    <form id="search-form" class="search-box">
      <input
        type="text"
        id="username-input"
        placeholder="Masukkan username GitHub (cth: torvalds)"
        autocomplete="off"
        required
      />
      <button type="submit" id="search-btn">Cari</button>
    </form>

    <!-- State: Loading -->
    <div id="loading" class="status-box hidden">
      <div class="spinner"></div>
      <p>Sedang mencari profil...</p>
    </div>

    <!-- State: Error (404 / Gagal) -->
    <div id="error-message" class="status-box error hidden"></div>

    <!-- State: Berhasil -->
    <section id="profile-card" class="card hidden">
      <img id="avatar" src="" alt="Avatar Pengguna" class="avatar" />
      <div class="profile-info">
        <h2 id="name"></h2>
        <p id="bio" class="bio"></p>
        <div class="stats">
          <span>Repositori Publik: <strong id="repos-count">0</strong></span>
        </div>
        <a id="profile-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-link">
          Lihat Profil di GitHub &rarr;
        </a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
