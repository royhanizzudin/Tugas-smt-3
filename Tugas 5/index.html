<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencari Profil GitHub</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
   <!-- MASUKKAN DI SINI (Baris paling atas di dalam body) -->
    <button onclick="toggleDarkMode()" style="float: right;">🌙 Mode Gelap</button>
    <div class="container">
        <h1>Cari Profil GitHub</h1>
        
        <!-- Form Pencarian -->
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Masukkan username GitHub..." required>
            <button type="submit">Cari</button>
        </form>

        <!-- Riwayat Pencarian -->
        <div class="history-container">
            <ul id="history-list"></ul>
            <button id="clear-history" class="hidden">Hapus Semua Riwayat</button>
        </div>

        <!-- Indikator Loading & Error -->
        <div id="loading" class="hidden">Mencari data...</div>
        <div id="error-message" class="hidden"></div>

        <!-- Kartu Hasil Profil -->
        <div id="profile-card" class="card hidden">
            <img id="avatar" src="" alt="Foto Profil">
            <h2 id="name"></h2>
            <p id="bio"></p>
            <p class="stats">Repositori Publik: <span id="repo-count"></span></p>
            <a id="profile-link" href="" target="_blank" class="btn">Kunjungi Profil</a>
            <h3>5 Repositori Terbaru:</h3>
            <div id="repo-list"></div>
        </div>
    </div>

    <!-- Menghubungkan ke file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
